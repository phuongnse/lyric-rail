name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_AUDIT_VERSION: "0.22.2"
  CARGO_FUZZ_VERSION: "0.13.2"
  CARGO_FUZZ_TOOLCHAIN: nightly-2026-07-01
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  policy-verification:
    name: Policy verification
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    uses: phuongnse/renovate-ops/.github/workflows/policy-verification.yml@38d952b8c94604df10fadc48b6c830a144ea1137

  python:
    name: Python 3.12 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install published engineering-process authority
        run: >-
          python -m pip install
          --isolated
          --disable-pip-version-check
          --no-input
          --no-cache-dir
          --require-hashes
          --only-binary :all:
          -r requirements/process.txt
      - name: Install FFmpeg on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install FFmpeg on macOS
        if: runner.os == 'macOS'
        run: command -v ffmpeg >/dev/null || brew install ffmpeg
      - name: Install FFmpeg on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) { choco install ffmpeg --no-progress -y }
      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -c requirements/constraints-tested.txt -e ".[dev]"
      - name: Validate managed process distribution
        if: runner.os == 'Linux'
        run: processctl adoption check --project-root . --requirements-lock requirements/process.txt
      - name: Run governed Python profile
        run: |
          processctl doctor --project-root .
          processctl verify --project-root . --profile python

  frontend:
    name: Frontend build and audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - name: Install published engineering-process authority
        run: >-
          python -m pip install
          --isolated
          --disable-pip-version-check
          --no-input
          --no-cache-dir
          --require-hashes
          --only-binary :all:
          -r requirements/process.txt
      - run: npm ci
      - name: Run governed frontend profile
        run: |
          processctl doctor --project-root .
          processctl verify --project-root . --profile frontend

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.dev/target-${{ runner.os }}-${{ runner.arch }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Restore exact Cargo caches
        id: cargo-cache
        uses: ./.github/actions/cargo-cache
        with:
          target-directory: ${{ env.CARGO_TARGET_DIR }}
          toolchain-fingerprint: stable
          cache-tools: "false"
          cargo-audit-version: ${{ env.CARGO_AUDIT_VERSION }}
          cargo-fuzz-version: ${{ env.CARGO_FUZZ_VERSION }}
      - name: Record Cargo cache conditions
        shell: bash
        run: |
          {
            echo "### Cargo cache conditions"
            echo "- dependency sources: ${{ steps.cargo-cache.outputs.dependency-cache-hit || 'false' }}"
            echo "- target outputs: ${{ steps.cargo-cache.outputs.target-cache-hit || 'false' }}"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Install published engineering-process authority
        run: >-
          python -m pip install
          --isolated
          --disable-pip-version-check
          --no-input
          --no-cache-dir
          --require-hashes
          --only-binary :all:
          -r requirements/process.txt
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf ffmpeg
      - name: Install native test media tools on macOS
        if: runner.os == 'macOS'
        run: command -v ffmpeg >/dev/null || brew install ffmpeg
      - name: Install native test media tools on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) { choco install ffmpeg --no-progress -y }
      - name: Validate native Windows bootstrap plan
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $plan = .\scripts\bootstrap_windows.ps1 -Plan | ConvertFrom-Json
          if ($plan.platform -ne "windows-x86_64" -or $plan.mutatesSystem) { throw "Invalid bootstrap plan" }
      - run: rustup toolchain install stable --profile minimal --component clippy --component rustfmt
      - run: rustup default stable
      - name: Run governed Rust profile
        if: runner.os != 'Windows'
        run: |
          processctl doctor --project-root .
          processctl verify --project-root . --profile rust
      - name: Validate Windows Rust environment
        if: runner.os == 'Windows'
        run: processctl doctor --project-root .
      - name: Run Windows Rust formatting gate
        if: runner.os == 'Windows'
        run: cargo fmt --all --check
      - name: Run Windows Rust test gate
        if: runner.os == 'Windows'
        run: cargo test --workspace --locked
      - name: Run Windows Rust lint gate
        if: runner.os == 'Windows'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  security:
    name: Dependency and fuzz gates
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.dev/target-${{ runner.os }}-${{ runner.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Restore exact Cargo caches
        id: cargo-cache
        uses: ./.github/actions/cargo-cache
        with:
          target-directory: ${{ env.CARGO_TARGET_DIR }}
          toolchain-fingerprint: ${{ env.CARGO_FUZZ_TOOLCHAIN }}
          cache-tools: "true"
          cargo-audit-version: ${{ env.CARGO_AUDIT_VERSION }}
          cargo-fuzz-version: ${{ env.CARGO_FUZZ_VERSION }}
      - name: Record Cargo cache conditions
        shell: bash
        run: |
          {
            echo "### Cargo cache conditions"
            echo "- dependency sources: ${{ steps.cargo-cache.outputs.dependency-cache-hit || 'false' }}"
            echo "- target outputs: ${{ steps.cargo-cache.outputs.target-cache-hit || 'false' }}"
            echo "- security tools: ${{ steps.cargo-cache.outputs.security-tools-cache-hit || 'false' }}"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Install published engineering-process authority
        run: >-
          python -m pip install
          --isolated
          --disable-pip-version-check
          --no-input
          --no-cache-dir
          --require-hashes
          --only-binary :all:
          -r requirements/process.txt
      - name: Install Python audit environment
        run: python -m pip install --upgrade pip && python -m pip install -c requirements/constraints-tested.txt -e ".[dev]" pip-audit
      - name: Install Rust security toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$CARGO_FUZZ_TOOLCHAIN" --profile minimal
          audit_version="$(cargo audit --version 2>/dev/null || true)"
          if [ "$audit_version" != "cargo-audit ${CARGO_AUDIT_VERSION}" ]; then
            rm -f "$HOME/.cargo/bin/cargo-audit"
            cargo install cargo-audit --version "$CARGO_AUDIT_VERSION" --locked --force
          fi
          fuzz_version="$(cargo fuzz --version 2>/dev/null || true)"
          if [ "$fuzz_version" != "cargo-fuzz ${CARGO_FUZZ_VERSION}" ]; then
            rm -f "$HOME/.cargo/bin/cargo-fuzz"
            cargo install cargo-fuzz --version "$CARGO_FUZZ_VERSION" --locked --force
          fi
          test "$(cargo audit --version)" = "cargo-audit ${CARGO_AUDIT_VERSION}"
          test "$(cargo fuzz --version)" = "cargo-fuzz ${CARGO_FUZZ_VERSION}"
      - name: Run governed security profile
        run: |
          processctl doctor --project-root .
          processctl verify --project-root . --profile security

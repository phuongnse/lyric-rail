name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  python:
    name: Python 3.12 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install FFmpeg on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install FFmpeg on macOS
        if: runner.os == 'macOS'
        run: command -v ffmpeg >/dev/null || brew install ffmpeg
      - name: Install FFmpeg on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) { choco install ffmpeg --no-progress -y }
      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -c requirements/constraints-tested.txt -e ".[dev]"
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Compile source
        run: python -m compileall -q src scripts
      - name: Run tests
        run: python -m pytest -q
      - name: Require packet-preserving media integration
        run: python -m pytest -q tests/test_player_media_delivery.py

  frontend:
    name: Frontend build and audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm audit --audit-level=moderate

  rust:
    name: Rust / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: rustup toolchain install stable --profile minimal
      - run: rustup default stable
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  security:
    name: Dependency and fuzz gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python audit environment
        run: python -m pip install --upgrade pip && python -m pip install -c requirements/constraints-tested.txt -e ".[dev]" pip-audit
      - name: Audit Python dependencies
        run: python -m pip_audit --progress-spinner off
      - name: Audit Rust dependencies
        run: cargo install cargo-audit --locked && cargo audit
      - name: Compile and smoke the package fuzzer
        run: rustup toolchain install nightly-2026-07-01 --profile minimal && cargo install cargo-fuzz --version 0.13.2 --locked && cargo +nightly-2026-07-01 fuzz run package_open -- -runs=1000 -max_len=512

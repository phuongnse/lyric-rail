name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  policy-verification:
    name: policy-verification
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    uses: phuongnse/renovate-ops/.github/workflows/policy-verification.yml@1e3d0d333b62ec92c94ea5c355bbb0cd73024b78

  python:
    name: Python 3.12 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install published engineering-process authority
        run: >-
          python -m pip install
          --isolated
          --disable-pip-version-check
          --no-input
          --require-hashes
          --only-binary :all:
          -r requirements/process.txt
      - name: Install FFmpeg on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install FFmpeg on macOS
        if: runner.os == 'macOS'
        run: command -v ffmpeg >/dev/null || brew install ffmpeg
      - name: Install FFmpeg on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) { choco install ffmpeg --no-progress -y }
      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -c requirements/constraints-tested.txt -e ".[dev]"
      - name: Validate complete process adoption candidate
        if: >-
          runner.os == 'Linux' &&
          github.event_name == 'pull_request' &&
          startsWith(github.head_ref, 'automation/renovate/engineering-process')
        run: >-
          processctl adoption check
          --project-root .
          --requirements-lock requirements/process.txt
      - name: Validate managed process distribution
        if: runner.os == 'Linux'
        run: processctl adoption check --project-root . --requirements-lock requirements/process.txt
      - name: Run governed Python profile
        run: |
          processctl doctor --project-root . --profile python
          processctl verify --project-root . --profile python

  frontend:
    name: Frontend build and audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - name: Install published engineering-process authority
        run: >-
          python -m pip install
          --isolated
          --disable-pip-version-check
          --no-input
          --require-hashes
          --only-binary :all:
          -r requirements/process.txt
      - run: npm ci
      - name: Run governed frontend profile
        run: |
          processctl doctor --project-root . --profile frontend
          processctl verify --project-root . --profile frontend

  rust:
    name: Rust / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install published engineering-process authority
        run: >-
          python -m pip install
          --isolated
          --disable-pip-version-check
          --no-input
          --require-hashes
          --only-binary :all:
          -r requirements/process.txt
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: rustup toolchain install stable --profile minimal --component clippy --component rustfmt
      - run: rustup default stable
      - name: Run governed Rust profile
        if: runner.os != 'Windows'
        run: |
          processctl doctor --project-root . --profile rust
          processctl verify --project-root . --profile rust
      - name: Validate Windows Rust environment (process 0.5.1 containment bridge)
        if: runner.os == 'Windows'
        run: processctl doctor --project-root . --profile rust
      - name: Run Windows Rust formatting gate
        if: runner.os == 'Windows'
        run: cargo fmt --all --check
      - name: Run Windows Rust test gate
        if: runner.os == 'Windows'
        run: cargo test --workspace --locked
      - name: Run Windows Rust lint gate
        if: runner.os == 'Windows'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  security:
    name: Dependency and fuzz gates
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install published engineering-process authority
        run: >-
          python -m pip install
          --isolated
          --disable-pip-version-check
          --no-input
          --require-hashes
          --only-binary :all:
          -r requirements/process.txt
      - name: Install Python audit environment
        run: python -m pip install --upgrade pip && python -m pip install -c requirements/constraints-tested.txt -e ".[dev]" pip-audit
      - name: Install Rust security toolchain
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          rustup toolchain install nightly-2026-07-01 --profile minimal
          cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Run governed security profile
        run: |
          processctl doctor --project-root . --profile security
          processctl verify --project-root . --profile security

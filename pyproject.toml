[build-system]
requires = ["setuptools>=83"]
build-backend = "setuptools.build_meta"

[project]
name = "lyricrail"
version = "0.8.0"
description = "Cross-platform karaoke production and encrypted LyricRail playback"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["karaoke", "audio", "video", "encrypted-media", "vietnamese"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Topic :: Multimedia :: Sound/Audio",
  "Topic :: Multimedia :: Video",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
]

[project.optional-dependencies]
bootstrap-common = [
  "audioread>=3.0.1",
  "librosa>=0.11,<1",
  "numpy>=1.26",
  "pillow>=12.3",
  "PyNaCl==1.6.2",
  "pytest>=8.0",
  "soundfile>=0.13",
  "transformers>=5.5,<6",
  "underthesea==9.5.0",
]
alignment = [
  "onnxruntime>=1.19.2,<2",
  "transformers>=5.5,<6",
  "torchaudio>=2.7",
  "soundfile>=0.13",
  "underthesea==9.5.0",
]
separation-gpu = [
  "audio-separator[gpu]>=0.44.5",
  "audioread>=3.0.1",
  "librosa>=0.11,<1",
]
separation-cpu = [
  "audio-separator[cpu]>=0.44.5",
  "audioread>=3.0.1",
  "librosa>=0.11,<1",
]
dev = [
  "librosa>=0.11,<1",
  "numpy>=1.26",
  "onnxruntime>=1.19.2,<2",
  "pillow>=12.3",
  "PyNaCl==1.6.2",
  "pytest>=8.0",
  "soundfile>=0.13",
  "torch>=2.7",
  "transformers>=5.5,<6",
  "underthesea==9.5.0",
]

[project.scripts]
lyricrail = "lyricrail.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

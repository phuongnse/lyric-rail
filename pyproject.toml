[build-system]
requires = ["setuptools>=83"]
build-backend = "setuptools.build_meta"

[project]
name = "lyricrail"
version = "0.8.0"
description = "Cross-platform karaoke production and encrypted LyricRail playback"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["karaoke", "audio", "video", "encrypted-media", "vietnamese"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Topic :: Multimedia :: Sound/Audio",
  "Topic :: Multimedia :: Video",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
]

[project.optional-dependencies]
youtube = [
  "google-api-python-client>=2.0",
  "google-auth-oauthlib>=1.0",
  "google-auth-httplib2>=0.2",
  "Pillow>=12.3,<13",
]
media = [
  "yt-dlp>=2026.7.4",
  "curl-cffi>=0.11,<0.16",
]
alignment = [
  "onnxruntime>=1.19.2,<2",
  "transformers>=5.5,<6",
  "torchaudio>=2.7",
  "soundfile>=0.13",
  "underthesea==9.5.0",
  "stanza==1.14.0",
]
separation-gpu = [
  "audio-separator[gpu]>=0.44.5",
  "audioread>=3.0.1",
  "librosa>=0.11,<1",
]
separation-cpu = [
  "audio-separator[cpu]>=0.44.5",
  "audioread>=3.0.1",
  "librosa>=0.11,<1",
]
dev = [
  "librosa>=0.11,<1",
  "numpy>=1.26",
  "onnxruntime>=1.19.2,<2",
  "PyNaCl==1.6.2",
  "pytest>=8.0",
  "soundfile>=0.13",
  "torch>=2.7",
  "transformers>=5.5,<6",
  "underthesea==9.5.0",
]

[project.scripts]
lyricrail = "lyricrail.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

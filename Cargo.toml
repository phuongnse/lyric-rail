[workspace]
resolver = "2"
members = [
  "crates/lrail-format",
  "crates/lrail-volume-security",
  "apps/studio/src-tauri",
  "apps/player/src-tauri",
  "apps/volume-broker",
]

[workspace.package]
version = "0.8.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1.0.98"
argon2 = "0.5.3"
chacha20poly1305 = { version = "0.10.1", features = ["std"] }
ciborium = "0.2.2"
clap = { version = "4.5.41", features = ["derive"] }
ed25519-dalek = "=2.2.0"
hex = "0.4.3"
hkdf = "0.12.4"
keyring = "4.1.5"
memsec = "=0.7.0"
rand = "0.8.5"
rpassword = "7.4.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
semver = "1.0.27"
sha2 = "0.10.9"
tempfile = "3.20.0"
thiserror = "2.0.12"
uuid = { version = "1.17.0", features = ["v4", "serde"] }
zeroize = { version = "1.8.1", features = ["zeroize_derive"] }

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
